# XcodeGen spec. On a Mac:  brew install xcodegen && xcodegen generate
name: LyricDash
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  LyricDash:
    type: application
    platform: iOS
    sources:
      - path: LyricDash
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: LyricDash/Info.plist
      properties:
        CFBundleDisplayName: LyricDash
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: "LyricDash uses location only to keep running in the background while you drive, so lyrics keep updating on CarPlay. Your location is never stored or sent anywhere."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Allow 'Always' so LyricDash can start lyrics automatically when CarPlay connects. Your location is never stored or sent anywhere."
        CFBundleURLTypes:
          - CFBundleURLName: lyricdash-auth
            CFBundleURLSchemes: [lyricdash]
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: LyricDash/LyricDash.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: LyricDashWidgets

  LyricDashWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LyricDashWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).widgets
    info:
      path: LyricDashWidgets/Info.plist
      properties:
        CFBundleDisplayName: LyricDash
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: LyricDashWidgets/LyricDashWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
